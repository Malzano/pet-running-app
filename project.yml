name: PawPace
options:
  minimumXcodeGenVersion: 2.40.0
  deploymentTarget:
    iOS: "17.0"
    watchOS: "10.0"
  createIntermediateGroups: true
  groupSortPosition: top

settings:
  base:
    SWIFT_VERSION: "5"
    IPHONEOS_DEPLOYMENT_TARGET: 17.0
    CURRENT_PROJECT_VERSION: 1
    MARKETING_VERSION: 1.0.0
    CODE_SIGN_STYLE: Automatic
    DEVELOPMENT_TEAM: ""
    ENABLE_USER_SCRIPT_SANDBOXING: true
  configs:
    Release:
      DEBUG_INFORMATION_FORMAT: dwarf-with-dsym
      SWIFT_COMPILATION_MODE: wholemodule
      SWIFT_OPTIMIZATION_LEVEL: "-O"
      ENABLE_TESTABILITY: false
      VALIDATE_PRODUCT: true

targets:
  PawPace:
    type: application
    platform: iOS
    sources:
      - path: PawPace
        excludes:
          - Features/Chat
          - Services/CompanionChatService.swift
          - Services/VoiceInputService.swift
      - path: Shared
      - path: SharedUI
      - path: PawPaceWidgets/PetWidgetIntents.swift
      - path: Config/Privacy/Phone/PrivacyInfo.xcprivacy
        buildPhase: resources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.pawpace.app
        PAWPACE_CLUB_API_URL: ""
        PRODUCT_NAME: PawPace
        INFOPLIST_FILE: Config/PawPace-Info.plist
        CODE_SIGN_ENTITLEMENTS: Config/PawPace.entitlements
        TARGETED_DEVICE_FAMILY: 1
        SUPPORTS_MACCATALYST: false
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    dependencies:
      - target: PawPaceWidgets
        embed: true
      - target: PawPaceLiveActivity
        embed: true
      - target: PawPaceWatch
        embed: true
        link: false
        copy:
          destination: productsDirectory
          subpath: "$(CONTENTS_FOLDER_PATH)/Watch"

  PawPaceWidgets:
    type: app-extension
    platform: iOS
    sources:
      - path: PawPaceWidgets
        excludes:
          - PawPaceLiveActivity.swift
      - path: Shared
      - path: SharedUI
      - path: Config/Privacy/iOS/PrivacyInfo.xcprivacy
        buildPhase: resources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.pawpace.app.widgets
        PRODUCT_NAME: PawPaceWidgets
        INFOPLIST_FILE: Config/PawPaceWidgets-Info.plist
        CODE_SIGN_ENTITLEMENTS: Config/PawPaceWidgets.entitlements
        TARGETED_DEVICE_FAMILY: 1
        SKIP_INSTALL: true
        APPLICATION_EXTENSION_API_ONLY: true

  PawPaceLiveActivity:
    type: app-extension
    platform: iOS
    deploymentTarget: "18.0"
    sources:
      - path: PawPaceLiveActivityWidgets
      - path: PawPaceWidgets/PawPaceLiveActivity.swift
      - path: PawPaceWidgets/PetWidgetIntents.swift
      - path: Shared
      - path: SharedUI
      - path: Config/Privacy/iOS/PrivacyInfo.xcprivacy
        buildPhase: resources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.pawpace.app.liveactivity
        PRODUCT_NAME: PawPaceLiveActivity
        INFOPLIST_FILE: Config/PawPaceWidgets-Info.plist
        CODE_SIGN_ENTITLEMENTS: Config/PawPaceWidgets.entitlements
        TARGETED_DEVICE_FAMILY: 1
        SKIP_INSTALL: true
        APPLICATION_EXTENSION_API_ONLY: true

  PawPaceTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: PawPaceTests
    dependencies:
      - target: PawPace
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.pawpace.app.tests
        GENERATE_INFOPLIST_FILE: true

  PawPaceWatch:
    type: application
    platform: watchOS
    deploymentTarget: "10.0"
    sources:
      - path: PawPaceWatch
      - path: Shared/PawPaceShared.swift
      - path: Shared/PawPacePrivateStorage.swift
      - path: Shared/WatchWorkoutRecoveryRecord.swift
      - path: Shared/PetLifecycle.swift
      - path: Shared/CompanionJourney.swift
      - path: Shared/BuddyBond.swift
      - path: Shared/BuddyKeepsakes.swift
      - path: Shared/DailyQuests.swift
      - path: Shared/PawPaceFormatting.swift
      - path: Shared/PawPaceWatchSync.swift
      - path: Shared/WorkoutActivity.swift
      - path: SharedUI/PawTheme.swift
      - path: SharedUI/MochiCreatureView.swift
      - path: SharedUI/AnimalPortraitView.swift
      - path: SharedUI/AnimalPortraits.xcassets
      - path: SharedUI/WorkoutPickerView.swift
      - path: Config/Privacy/watchOS/PrivacyInfo.xcprivacy
        buildPhase: resources
    dependencies:
      - sdk: HealthKit.framework
      - sdk: WatchConnectivity.framework
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.pawpace.app.watchkitapp
        PRODUCT_NAME: PawPaceWatch
        INFOPLIST_FILE: Config/PawPaceWatch-Info.plist
        CODE_SIGN_ENTITLEMENTS: Config/PawPaceWatch.entitlements
        WATCHOS_DEPLOYMENT_TARGET: 10.0
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        SKIP_INSTALL: true
        TARGETED_DEVICE_FAMILY: 4

schemes:
  PawPace:
    build:
      targets:
        PawPace: all
        PawPaceLiveActivity: all
        PawPaceWidgets: all
        PawPaceTests: [test]
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - PawPaceTests
    archive:
      config: Release

  PawPaceWatch:
    build:
      targets:
        PawPaceWatch: all
    run:
      config: Debug
    archive:
      config: Release
