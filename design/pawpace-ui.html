    --background,
    light-dark(rgb(255 255 255), rgb(24 24 24))

}

.form-check:not(.form-switch) .form-check-input[type=&quot;checkbox&quot;]:checked {
  border-color: var(--primary);
  background-color: var(--primary);
}

.form-check:not(.form-switch)
  .form-check-input[type=&quot;checkbox&quot;]:checked::before {
  display: block;
  width: 100%;
  height: 100%;
  background: var(--primary-foreground);
  content: &quot;&quot;;
  mask: var(--checkmark-image) center / 12px 12px no-repeat;
}

.form-check-input[type=&quot;radio&quot;] {
  width: 14px;
  height: 14px;
  border-radius: var(--radius-full);
}

.form-check-input[type=&quot;radio&quot;]:checked {
  border: 2px solid var(--primary);
  background:
    radial-gradient(circle, var(--primary-foreground) 0 2.5px, transparent 3px),
    var(--primary);
}

.form-check:not(.form-switch) .form-check-input:focus-visible {
  outline: 2px solid var(--ring);
  outline-offset: 2px;
}

.form-check:not(.form-switch) .form-check-input:disabled {
  cursor: not-allowed;
  pointer-events: none;
}

.form-check:not(.form-switch) .form-check-input:disabled + .form-check-label {
  cursor: not-allowed;
}

.form-switch .form-check-input:disabled,
.form-switch .form-check-input:disabled + .form-check-label {
  cursor: not-allowed;
  opacity: 0.6;
}

.form-check-label {
  color: var(--foreground);
  cursor: var(--cursor-interaction, default);
}

.form-switch .form-check-input {
  position: relative;
  width: 32px;
  height: 20px;
  border: 0;
  border-radius: var(--radius-full);
  background: var(--muted);
  box-shadow: none;
  transition: background-color 200ms cubic-bezier(0, 0, 0.2, 1);
}

.form-switch .form-check-input::before {
  position: absolute;
  top: 50%;
  left: 0;
  width: 16px;
  height: 16px;
  box-sizing: border-box;
  border: 1px solid light-dark(var(--primary-foreground), var(--foreground));
  border-radius: var(--radius-full);
  background: light-dark(var(--primary-foreground), var(--foreground));
  box-shadow: var(--shadow-sm);
  content: &quot;&quot;;
  transform: translate(2px, -50%);
  transition: transform 200ms cubic-bezier(0, 0, 0.2, 1);
}

.form-switch .form-check-input:checked {
  background: var(--primary);
}

.form-switch .form-check-input:checked::before {
  transform: translate(14px, -50%);
}

.form-switch .form-check-input:focus-visible {
  box-shadow: 0 0 0 2px var(--ring);
}

.form-range {
  appearance: none;
  display: block;
  width: 100%;
  height: 28px;
  flex: 1;
  margin: 0;
  padding: 0;
  outline: none;
  border: 0;
  accent-color: var(--primary);
  background: linear-gradient(
      color-mix(in srgb, var(--foreground) 7%, transparent),
      color-mix(in srgb, var(--foreground) 7%, transparent)
    )
    center / 100% 2px no-repeat;
}

.form-range::-webkit-slider-runnable-track {
  height: 28px;
  background: transparent;
}

.form-range::-webkit-slider-thumb {
  appearance: none;
  width: 20px;
  height: 20px;
  margin-top: 4px;
  border: 1px solid var(--border);
  border-radius: var(--radius-full);
  background: light-dark(var(--primary-foreground), var(--foreground));
}

.form-range:focus-visible::-webkit-slider-thumb {
  border-color: var(--ring);
  box-shadow: inset 0 0 0 1px var(--ring);
}

.form-range::-moz-range-track {
  height: 28px;
  background: transparent;
}

.form-range::-moz-range-thumb {
  width: 20px;
  height: 20px;
  border: 1px solid var(--border);
  border-radius: var(--radius-full);
  background: light-dark(var(--primary-foreground), var(--foreground));
}

.form-range:focus-visible::-moz-range-thumb {
  border-color: var(--ring);
  box-shadow: inset 0 0 0 1px var(--ring);
}

.form-range:disabled {
  cursor: not-allowed;
  opacity: 0.4;
}

.btn:not(.btn-primary, .viz-tile):is(
  [aria-pressed=&quot;true&quot;],
  [aria-selected=&quot;true&quot;],
  .is-selected
) {
  border-color: var(--primary);

  background: var(--primary);
}

.btn.viz-tile:is([aria-pressed=&quot;true&quot;], [aria-selected=&quot;true&quot;], .is-selected) {
  border-color: var(--primary);
  box-shadow: inset 0 0 0 1px var(--primary);
}

.btn:focus-visible {
  outline: 2px solid var(--ring);
  outline-offset: 2px;
}

svg {

  max-width: 100%;
  height: auto;

#widget &gt; svg {

/* Model-authored chart rules can otherwise stretch icons after these styles load. */
svg.lucide {

  flex: none;

.text-destructive {

}

  &lt;script&gt;
    (() =&gt; {
      const root = document.getElementById(&#x27;pawpace-ui-v1&#x27;);
      if (!root) return;

      const toast = root.querySelector(&#x27;[data-toast]&#x27;);
      let toastTimer;
      const showToast = (message) =&gt; {
        toast.textContent = message;
        toast.classList.add(&#x27;show&#x27;);
        clearTimeout(toastTimer);
        toastTimer = setTimeout(() =&gt; toast.classList.remove(&#x27;show&#x27;), 1600);
      };

      const setMode = (mode) =&gt; {
        root.querySelectorAll(&#x27;[data-mode]&#x27;).forEach((button) =&gt; button.setAttribute(&#x27;aria-pressed&#x27;, String(button.dataset.mode === mode)));
        root.querySelectorAll(&#x27;[data-view]&#x27;).forEach((view) =&gt; { view.hidden = view.dataset.view !== mode; });
      };

      root.querySelectorAll(&#x27;[data-mode]&#x27;).forEach((button) =&gt; button.addEventListener(&#x27;click&#x27;, () =&gt; setMode(button.dataset.mode)));

      const setTab = (tab) =&gt; {
        root.querySelectorAll(&#x27;[data-tab]&#x27;).forEach((button) =&gt; button.setAttribute(&#x27;aria-selected&#x27;, String(button.dataset.tab === tab)));
        root.querySelectorAll(&#x27;[data-page]&#x27;).forEach((page) =&gt; { page.hidden = page.dataset.page !== tab; });
      };

      root.querySelectorAll(&#x27;[data-tab]&#x27;).forEach((button) =&gt; button.addEventListener(&#x27;click&#x27;, () =&gt; setTab(button.dataset.tab)));
      root.querySelectorAll(&#x27;[data-tab-jump]&#x27;).forEach((button) =&gt; button.addEventListener(&#x27;click&#x27;, () =&gt; setTab(button.dataset.tabJump)));

      const petSpeech = root.querySelector(&#x27;[data-pet-speech]&#x27;);
      const petStage = root.querySelector(&#x27;[data-pet-stage]&#x27;);
      const petReplies = {
        fed: [&#x27;Crunch! Carrots make my tail faster.&#x27;, &#x27;Snack power restored!&#x27;],
        loved: [&#x27;That is exactly the right spot! 💜&#x27;, &#x27;Best human. No contest.&#x27;],
        played: [&#x27;Catch me if you can!&#x27;, &#x27;One more throw—please? 🎾&#x27;]
      };
      let xp = 340;

      root.querySelectorAll(&#x27;[data-pet-action]&#x27;).forEach((button) =&gt; button.addEventListener(&#x27;click&#x27;, () =&gt; {
        const choices = petReplies[button.dataset.petAction];
        petSpeech.textContent = choices[Math.floor(Math.random() * choices.length)];
        xp = Math.min(500, xp + 8);
        root.querySelector(&#x27;[data-xp-label]&#x27;).textContent = `${xp} / 500`;
        root.querySelector(&#x27;[data-xp-bar]&#x27;).style.width = `${(xp / 500) * 100}%`;
        root.querySelector(&#x27;[role=&quot;progressbar&quot;]&#x27;).setAttribute(&#x27;aria-valuenow&#x27;, String(xp));
        petStage.classList.remove(&#x27;pp-bounce&#x27;);
        void petStage.offsetWidth;
        petStage.classList.add(&#x27;pp-bounce&#x27;);
        showToast(&#x27;+8 pet XP&#x27;);
      }));

      const chatForm = root.querySelector(&#x27;[data-chat-form]&#x27;);
      const chatInput = root.querySelector(&#x27;[data-chat-input]&#x27;);
      const messages = root.querySelector(&#x27;[data-messages]&#x27;);
      const sendChat = (text) =&gt; {
        const clean = text.trim();
        if (!clean) return;
        const userMessage = document.createElement(&#x27;div&#x27;);
        userMessage.className = &#x27;pp-message user&#x27;;
        userMessage.textContent = clean;
        messages.appendChild(userMessage);
        const petMessage = document.createElement(&#x27;div&#x27;);
        petMessage.className = &#x27;pp-message pet&#x27;;
        petMessage.textContent = &#x27;I’m listening! Let’s make today an adventure together. 🐾&#x27;;
        messages.appendChild(petMessage);
        while (messages.children.length &gt; 5) messages.removeChild(messages.children[1]);
        chatInput.value = &#x27;&#x27;;
      };

      chatForm.addEventListener(&#x27;submit&#x27;, (event) =&gt; { event.preventDefault(); sendChat(chatInput.value); });
      root.querySelectorAll(&#x27;.pp-suggestion&#x27;).forEach((button) =&gt; button.addEventListener(&#x27;click&#x27;, () =&gt; sendChat(button.textContent || &#x27;&#x27;)));

      let isRunning = false;
      const runControl = root.querySelector(&#x27;[data-run-control]&#x27;);
      runControl.addEventListener(&#x27;click&#x27;, () =&gt; {
        isRunning = !isRunning;
        runControl.classList.toggle(&#x27;is-running&#x27;, isRunning);
        runControl.textContent = isRunning ? &#x27;Ⅱ Pause run&#x27; : &#x27;▶ Resume run with Mochi&#x27;;
        root.querySelector(&#x27;[data-run-status]&#x27;).textContent = isRunning ? &#x27;Tracking with GPS&#x27; : &#x27;Run paused&#x27;;
        root.querySelector(&#x27;[data-distance]&#x27;).textContent = isRunning ? &#x27;0.03&#x27; : &#x27;0.03&#x27;;
        root.querySelector(&#x27;[data-pace]&#x27;).textContent = isRunning ? &#x27;8′12″&#x27; : &#x27;—&#x27;;
        root.querySelector(&#x27;[data-run-time]&#x27;).textContent = &#x27;00:14&#x27;;
        showToast(isRunning ? &#x27;Mochi is running with you&#x27; : &#x27;Run paused&#x27;);
      });

      root.querySelectorAll(&#x27;.pp-item&#x27;).forEach((item) =&gt; item.addEventListener(&#x27;click&#x27;, () =&gt; {
        root.querySelectorAll(&#x27;.pp-item&#x27;).forEach((peer) =&gt; peer.setAttribute(&#x27;aria-pressed&#x27;, &#x27;false&#x27;));
        item.setAttribute(&#x27;aria-pressed&#x27;, &#x27;true&#x27;);
        showToast(`${item.querySelector(&#x27;.pp-item-name&#x27;).textContent} equipped`);
      }));

      const setWidgetSize = (size) =&gt; {
        root.querySelectorAll(&#x27;[data-widget-size]&#x27;).forEach((button) =&gt; button.setAttribute(&#x27;aria-pressed&#x27;, String(button.dataset.widgetSize === size)));
        root.querySelectorAll(&#x27;[data-widget-layout]&#x27;).forEach((layout) =&gt; { layout.hidden = layout.dataset.widgetLayout !== size; });
      };

      root.querySelectorAll(&#x27;[data-widget-size]&#x27;).forEach((button) =&gt; button.addEventListener(&#x27;click&#x27;, () =&gt; setWidgetSize(button.dataset.widgetSize)));

      let widgetEnergy = 72;
      root.querySelectorAll(&#x27;[data-widget-feed]&#x27;).forEach((button) =&gt; button.addEventListener(&#x27;click&#x27;, () =&gt; {
        widgetEnergy = Math.min(100, widgetEnergy + 12);
        root.querySelectorAll(&#x27;[data-widget-pet]&#x27;).forEach((pet) =&gt; { pet.textContent = &#x27;😋&#x27;; });
        root.querySelectorAll(&#x27;[data-widget-talk]&#x27;).forEach((talk) =&gt; { talk.textContent = &#x27;Carrot received. You understand me.&#x27;; });
        root.querySelectorAll(&#x27;[data-widget-energy]&#x27;).forEach((energy) =&gt; { energy.textContent = `${widgetEnergy}% energy`; });
        showToast(&#x27;Mochi ate a carrot&#x27;);
      }));

      root.querySelectorAll(&#x27;[data-open-chat]&#x27;).forEach((button) =&gt; button.addEventListener(&#x27;click&#x27;, () =&gt; { setMode(&#x27;app&#x27;); setTab(&#x27;chat&#x27;); }));
      root.querySelectorAll(&#x27;[data-widget-play]&#x27;).forEach((button) =&gt; button.addEventListener(&#x27;click&#x27;, () =&gt; {
        root.querySelectorAll(&#x27;[data-widget-talk]&#x27;).forEach((talk) =&gt; { talk.textContent = &#x27;Ball acquired. Activating maximum zoomies! 🎾&#x27;; });
        showToast(&#x27;+5 friendship&#x27;);
      }));

      let livePaused = false;
      root.querySelector(&#x27;[data-live-pause]&#x27;).addEventListener(&#x27;click&#x27;, (event) =&gt; {
        livePaused = !livePaused;
        event.currentTarget.textContent = livePaused ? &#x27;▶ Resume&#x27; : &#x27;Ⅱ Pause&#x27;;
        root.querySelector(&#x27;[data-live-state]&#x27;).textContent = livePaused ? &#x27;Paused&#x27; : &#x27;18:42 active&#x27;;
        showToast(livePaused ? &#x27;Run paused&#x27; : &#x27;Run resumed&#x27;);
      });

      root.querySelector(&#x27;[data-live-cheer]&#x27;).addEventListener(&#x27;click&#x27;, () =&gt; {
        root.querySelector(&#x27;[data-lock-bubble]&#x27;).textContent = &#x27;A cheer! My tail is officially turbocharged. 💜&#x27;;
        showToast(&#x27;+5 friendship&#x27;);
      });
    })();

&lt;script src=&quot;https://unpkg.com/@floating-ui/core@1.7.3/dist/floating-ui.core.umd.min.js&quot;&gt;&lt;/script&gt;
&lt;script src=&quot;https://unpkg.com/@floating-ui/dom@1.7.4/dist/floating-ui.dom.umd.min.js&quot;&gt;&lt;/script&gt;
&lt;script&gt;
(() =&gt; {
  if (window.FloatingUIDOM == null) {
    return;
  }
  const { autoUpdate, computePosition, flip, offset, shift, size } =
    window.FloatingUIDOM;
  const tooltipPlacements = new Set([&quot;top&quot;, &quot;right&quot;, &quot;bottom&quot;, &quot;left&quot;]);
  const tooltipId = `codex-visualization-tooltip-${
    window.crypto?.randomUUID?.() ?? Date.now().toString(36)
  }`;
  const tooltipGap = 5;
  const hoverDelay = 700;
  const skipDelay = 300;
  let activeTrigger = null;
  let pendingTrigger = null;
  let tooltip = null;
  let openTimeout = null;
  let autoUpdateCleanup = null;
  let positionRequest = 0;
  let skipDelayUntil = 0;

  const getTrigger = (target) =&gt;
    target?.nodeType === Node.ELEMENT_NODE
      ? target.closest(&quot;[data-tooltip]&quot;)
      : null;
  const containsTarget = (trigger, target) =&gt;
    target?.nodeType != null &amp;&amp; trigger.contains(target);
  const getContent = (trigger) =&gt;
    trigger.getAttribute(&quot;data-tooltip&quot;)?.trim() ?? &quot;&quot;;
  const getPlacement = (trigger) =&gt; {
    const placement = trigger.getAttribute(&quot;data-tooltip-placement&quot;);
    return tooltipPlacements.has(placement) ? placement : &quot;top&quot;;
  };
  const getTooltip = () =&gt; {
    if (tooltip == null) {
      tooltip = document.createElement(&quot;div&quot;);
      tooltip.id = tooltipId;
      tooltip.className = &quot;tooltip&quot;;
      tooltip.setAttribute(&quot;role&quot;, &quot;tooltip&quot;);
    }
    return tooltip;
  };
  const setDescribedBy = (trigger, described) =&gt; {
    const ids = new Set(
      (trigger.getAttribute(&quot;aria-describedby&quot;) ?? &quot;&quot;)
        .split(/\s+/)
        .filter(Boolean),
    );
    if (described) {
      ids.add(tooltipId);
    } else {
      ids.delete(tooltipId);
    }
    if (ids.size === 0) {
      trigger.removeAttribute(&quot;aria-describedby&quot;);
    } else {
      trigger.setAttribute(&quot;aria-describedby&quot;, [...ids].join(&quot; &quot;));
    }
  };
  const clearOpenTimeout = () =&gt; {
    if (openTimeout != null) {
      window.clearTimeout(openTimeout);
      openTimeout = null;
    }
    pendingTrigger = null;
  };
  const closeTooltip = (activateSkipDelay = true) =&gt; {
    clearOpenTimeout();
    positionRequest += 1;
    autoUpdateCleanup?.();
    autoUpdateCleanup = null;
    if (activeTrigger == null) {
      return;
    }
    setDescribedBy(activeTrigger, false);
    activeTrigger = null;
    tooltip?.remove();
    if (activateSkipDelay) {
      skipDelayUntil = Date.now() + skipDelay;
    }
  };
  const updatePosition = (trigger, floating) =&gt; {
    const request = ++positionRequest;
    void computePosition(trigger, floating, {
      middleware: [
        offset(tooltipGap),
        flip({ padding: tooltipGap }),
        shift({ padding: tooltipGap }),
        size({
          padding: tooltipGap,
          apply({ availableHeight, availableWidth, elements }) {
            elements.floating.style.setProperty(
              &quot;--tooltip-available-width&quot;,
              `${Math.max(0, availableWidth)}px`,
            );
            elements.floating.style.setProperty(
              &quot;--tooltip-available-height&quot;,
              `${Math.max(0, availableHeight)}px`,
            );
          },
        }),
      ],
      placement: getPlacement(trigger),
      strategy: &quot;fixed&quot;,
    })
      .then(({ x, y }) =&gt; {
        if (activeTrigger !== trigger || request !== positionRequest) {
          return;
        }
        const scale = window.devicePixelRatio || 1;
        floating.style.transform = `translate(${Math.round(x * scale) / scale}px, ${Math.round(y * scale) / scale}px)`;
        floating.style.visibility = &quot;visible&quot;;
      })
      .catch(() =&gt; {
        if (activeTrigger === trigger &amp;&amp; request === positionRequest) {
          closeTooltip(false);
        }
      });
  };
  const openTooltip = (trigger) =&gt; {
    const content = getContent(trigger);
    if (!trigger.isConnected || content.length === 0) {
      return;
    }
    clearOpenTimeout();
    if (activeTrigger === trigger) {
      return;
    }
    closeTooltip();
    const floating = getTooltip();
    floating.textContent = content;
    floating.style.visibility = &quot;hidden&quot;;
    floating.style.transform = &quot;translate(0, 0)&quot;;
    document.body.appendChild(floating);
    activeTrigger = trigger;
    setDescribedBy(trigger, true);
    autoUpdateCleanup = autoUpdate(trigger, floating, () =&gt; {
      updatePosition(trigger, floating);
    });
  };
  const requestOpen = (trigger, immediate = false) =&gt; {
    if (
      getContent(trigger).length === 0 ||
      activeTrigger === trigger ||
      pendingTrigger === trigger
    ) {
      return;
    }
    clearOpenTimeout();
    pendingTrigger = trigger;
    const delay =
      immediate || activeTrigger != null || Date.now() &lt; skipDelayUntil
        ? 0
        : hoverDelay;
    if (delay === 0) {
      openTooltip(trigger);
      return;
    }
    openTimeout = window.setTimeout(() =&gt; {
      openTimeout = null;
      pendingTrigger = null;
      openTooltip(trigger);
    }, delay);
  };
  const handlePointerOpen = (event) =&gt; {
    if (event.pointerType === &quot;touch&quot;) {
      return;
    }
    const trigger = getTrigger(event.target);
    if (trigger == null || containsTarget(trigger, event.relatedTarget)) {
      return;
    }
    requestOpen(trigger);
  };
  const handleLeave = (event) =&gt; {
    const trigger = getTrigger(event.target);
    if (trigger == null || containsTarget(trigger, event.relatedTarget)) {
      return;
    }
    if (activeTrigger === trigger || pendingTrigger === trigger) {
      closeTooltip();
    }
  };
  const handleFocusIn = (event) =&gt; {
    const trigger = getTrigger(event.target);
    if (trigger?.matches(&quot;:focus-visible&quot;)) {
      requestOpen(trigger, true);
    }
  };
  const handleKeyDown = (event) =&gt; {
    if (event.key === &quot;Escape&quot;) {
      closeTooltip();
    }
  };
  const handleContextMenu = (event) =&gt; {
    const trigger = getTrigger(event.target);
    if (activeTrigger === trigger || pendingTrigger === trigger) {
      closeTooltip();
    }
  };
  const destroy = () =&gt; {
    closeTooltip(false);
    document.removeEventListener(&quot;pointerover&quot;, handlePointerOpen);
    document.removeEventListener(&quot;pointerout&quot;, handleLeave);
    document.removeEventListener(&quot;focusin&quot;, handleFocusIn);
    document.removeEventListener(&quot;focusout&quot;, handleLeave);
    document.removeEventListener(&quot;keydown&quot;, handleKeyDown);
    document.removeEventListener(&quot;contextmenu&quot;, handleContextMenu);
    tooltip = null;
  };

  document.addEventListener(&quot;pointerover&quot;, handlePointerOpen);
  document.addEventListener(&quot;pointerout&quot;, handleLeave);
  document.addEventListener(&quot;focusin&quot;, handleFocusIn);
  document.addEventListener(&quot;focusout&quot;, handleLeave);
  document.addEventListener(&quot;keydown&quot;, handleKeyDown);
  document.addEventListener(&quot;contextmenu&quot;, handleContextMenu);
  window.addEventListener(&quot;pagehide&quot;, destroy, { once: true });
})();
&lt;/script&gt;

(() =&gt; {
